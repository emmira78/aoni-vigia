name: Vigía del VPS de Aoni Teema

# Si Hostinger apaga el VPS y no lo vuelve a encender (pasó el 16 y el 17/10/2026,
# en su mantenimiento de emergencia: la web quedó caída 14 horas de noche), esto lo
# enciende solo. Cada 5 minutos mira si aoniteema.com responde; si no, le pregunta a
# Hostinger cómo está el VPS, y SOLO si está «stopped» lo enciende.
#
# No reinicia un VPS encendido ni toca uno suspendido: ahí el problema es otro y lo
# tiene que mirar una persona.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  # Cada cambio al vigía se prueba solo: consulta el estado del VPS (prueba el token) sin tocar nada.
  push:
    branches: [main]
    paths: [".github/workflows/vigia.yml"]

permissions:
  contents: read
  actions: write # para mantener vivo el horario (último paso)

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITIO: https://aoniteema.com/
      VPS_ID: "1932354"
      API: https://developers.hostinger.com/api/vps/v1/virtual-machines
    steps:
      - name: ¿Responde el sitio?
        id: sitio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Una vez por día se consulta el estado del VPS aunque el sitio ande: si el token venció,
          # la corrida falla y GitHub avisa ese mismo día.
          #
          # SIN VENTANA DE 5 MINUTOS (22/11/2026). GitHub no corre el horario cada 5 minutos sino
          # cuando puede (3 a 5 veces por día en noviembre), así que la ventana 12:00-12:04 UTC no
          # se pisó nunca: ni la consulta diaria ni «Mantener vivo el horario» corrieron desde el
          # 19/10. Ahora la diaria es la PRIMERA corrida del día después de las 12 UTC (las 9 de
          # Argentina): la anterior empezó antes de esa hora. Si no se puede preguntar, se consulta
          # igual: mirar de más no rompe nada; de menos, sí.
          ahora=$(date -u +%s)
          hoy12=$(date -u -d "today 12:00" +%s)
          if [ "$ahora" -ge "$hoy12" ]; then
            anterior=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vigia.yml/runs?event=schedule&per_page=2" --jq '.workflow_runs[1].run_started_at // empty' 2>/dev/null || true)
            if [ -z "$anterior" ] || [ "$(date -u -d "$anterior" +%s)" -lt "$hoy12" ]; then
              echo "diaria=si" >> "$GITHUB_OUTPUT"
              echo "Primera corrida del día después de las 12 UTC: consulta diaria."
            fi
          fi
          for intento in 1 2 3; do
            codigo=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$SITIO" || true)
            if [ "$codigo" = "200" ]; then
              echo "responde=si" >> "$GITHUB_OUTPUT"
              echo "El sitio responde (200)."
              exit 0
            fi
            echo "Intento $intento: respondió «$codigo»."
            [ "$intento" -lt 3 ] && sleep 20
          done
          echo "responde=no" >> "$GITHUB_OUTPUT"

      # A mano, al cambiar el vigía y en la consulta diaria se mira siempre: prueba que el token anda.
      - name: Estado del VPS en Hostinger
        id: vps
        if: steps.sitio.outputs.responde == 'no' || steps.sitio.outputs.diaria == 'si' || github.event_name != 'schedule'
        env:
          TOKEN: ${{ secrets.MONITOREO_AONI }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secreto MONITOREO_AONI en este repositorio."
            exit 1
          fi
          respuesta=$(curl -sf -m 30 -H "Authorization: Bearer $TOKEN" "$API/$VPS_ID") || {
            echo "::error::Hostinger no contestó el estado del VPS (¿el token venció o se cargó mal?)."
            exit 1
          }
          estado=$(echo "$respuesta" | jq -r '.state')
          echo "estado=$estado" >> "$GITHUB_OUTPUT"
          echo "El VPS está: $estado"

      - name: Encenderlo si Hostinger lo dejó apagado
        if: steps.sitio.outputs.responde == 'no' && steps.vps.outputs.estado == 'stopped'
        env:
          TOKEN: ${{ secrets.MONITOREO_AONI }}
        run: |
          curl -sf -m 30 -X POST -H "Authorization: Bearer $TOKEN" "$API/$VPS_ID/start" > /dev/null || {
            echo "::error::El VPS está apagado y Hostinger no aceptó encenderlo."
            exit 1
          }
          # Falla a propósito: así GitHub manda un correo y queda a la vista que pasó.
          echo "::error::El VPS estaba apagado y se pidió encenderlo. La web vuelve en un par de minutos."
          exit 1

      # Falla a propósito (22/11/2026): con un aviso amarillo la corrida terminaba en verde y GitHub
      # no mandaba ningún correo. El 23/10 el servidor quedó colgado encendido y nadie se enteró.
      - name: El sitio no responde, pero el VPS no está apagado
        if: steps.sitio.outputs.responde == 'no' && steps.vps.outputs.estado != 'stopped' && steps.vps.outputs.estado != ''
        run: |
          echo "::error::El sitio no responde y el VPS está «${{ steps.vps.outputs.estado }}»: no se toca nada (puede ser un despliegue en curso o un problema adentro). Hay que mirarlo."
          exit 1

      # GitHub apaga los horarios de un repositorio sin cambios en 60 días. Una vez por
      # día (con la consulta diaria) se vuelve a habilitar el horario por la API, que
      # reinicia esa cuenta. `always()`: aunque un paso anterior haya fallado a propósito.
      - name: Mantener vivo el horario
        if: always() && github.event_name == 'schedule' && steps.sitio.outputs.diaria == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/vigia.yml/enable" && echo "Horario renovado."
